<!DOCTYPE html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Lounge — Quiet Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }

    /* Theme 1: Midnight Velvet (Modern Glass) */
    html[data-theme="midnight"] {
      --bg: #030712;
      --card-bg: rgba(17, 24, 39, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.14);
      --input-bg: rgba(15, 23, 42, 0.7);
      --primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --glow: rgba(99, 102, 241, 0.15);
    }

    /* Theme 2: Cyber Neon (Vibrant High-Contrast) */
    html[data-theme="cyber"] {
      --bg: #050508;
      --card-bg: rgba(13, 15, 26, 0.75);
      --card-border: rgba(56, 189, 248, 0.18);
      --card-hover: rgba(56, 189, 248, 0.35);
      --input-bg: rgba(8, 10, 18, 0.85);
      --primary: linear-gradient(135deg, #0284c7 0%, #06b6d4 100%);
      --accent: #38bdf8;
      --text: #f0fdfa;
      --text-muted: #67e8f9;
      --glow: rgba(6, 182, 212, 0.18);
    }

    /* Theme 3: Obsidian Minimal (Apple/Linear Style) */
    html[data-theme="obsidian"] {
      --bg: #000000;
      --card-bg: #111111;
      --card-border: #222222;
      --card-hover: #333333;
      --input-bg: #181818;
      --primary: linear-gradient(135deg, #ffffff 0%, #d4d4d8 100%);
      --primary-text: #000000;
      --accent: #ffffff;
      --text: #fafafa;
      --text-muted: #a1a1aa;
      --glow: rgba(255, 255, 255, 0.05);
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.25s ease;
    }

    .theme-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .theme-card:hover {
      border-color: var(--card-hover);
    }

    .theme-input {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      color: var(--text);
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .theme-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--glow);
    }

    .theme-btn {
      background: var(--primary);
      color: #ffffff;
    }
    html[data-theme="obsidian"] .theme-btn {
      color: #000000 !important;
    }

    .ambient-glow {
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: var(--glow);
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      border-radius: 50%;
    }

    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white pb-24 relative overflow-x-hidden">

  <!-- Ambient Light Effect -->
  <div class="ambient-glow"></div>

  <!-- Top Navbar -->
  <header class="sticky top-0 z-50 theme-card border-b border-white/5 px-4 py-3">
    <div class="max-w-4xl mx-auto flex items-center justify-between">
      
      <!-- Brand -->
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl theme-btn flex items-center justify-center font-bold text-sm shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </div>
        <div>
          <span class="font-bold text-sm tracking-tight block leading-none">Lounge</span>
          <span class="text-[10px] text-slate-400 font-medium leading-none">Zero Pressure Network</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex items-center gap-2">
        <div class="relative">
          <select id="themeSelector" onchange="switchTheme(this.value)" class="theme-input text-xs font-medium py-1.5 px-3 rounded-full outline-none appearance-none pr-7 cursor-pointer">
            <option value="midnight">🌌 Midnight</option>
            <option value="cyber">⚡ Cyber</option>
            <option value="obsidian">💎 Obsidian</option>
          </select>
          <div class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-slate-400 text-[10px]">▼</div>
        </div>

        <div id="navUser" class="hidden items-center gap-2">
          <select id="batteryStatus" onchange="updateBattery()" class="theme-input text-xs font-medium py-1.5 px-3 rounded-full outline-none cursor-pointer">
            <option value="🔋 Active">🔋 High</option>
            <option value="⚡ Lurking">⚡ Low</option>
            <option value="🔕 Do Not Disturb">🔕 Mute</option>
          </select>
          <button onclick="logout()" class="text-xs text-rose-400/80 hover:text-rose-400 py-1.5 px-2.5 rounded-full hover:bg-rose-500/10 transition">Exit</button>
        </div>
      </div>

    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-6 relative z-10">

    <!-- Auth Container -->
    <div id="authSection" class="max-w-sm mx-auto theme-card p-6 sm:p-8 rounded-3xl shadow-2xl mt-8">
      <div class="text-center mb-6">
        <div class="w-12 h-12 theme-btn rounded-2xl mx-auto flex items-center justify-center mb-3 shadow-lg">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>
        <h2 class="text-lg font-bold tracking-tight">Enter Your Space</h2>
        <p class="text-xs text-slate-400 mt-1">Anonymous, private & low-energy connection</p>
      </div>

      <div class="space-y-3">
        <div id="signupFields">
          <input id="authUsername" type="text" placeholder="Anonymous alias (@zen_walker)" class="w-full theme-input px-4 py-3 rounded-2xl text-xs outline-none">
        </div>
        <input id="authEmail" type="email" placeholder="Email address" class="w-full theme-input px-4 py-3 rounded-2xl text-xs outline-none">
        <input id="authPass" type="password" placeholder="Password" class="w-full theme-input px-4 py-3 rounded-2xl text-xs outline-none">
        
        <button id="authSubmitBtn" onclick="handleAuth()" class="w-full theme-btn font-semibold py-3 rounded-2xl text-xs shadow-lg transition active:scale-95">Enter Lounge</button>

        <p class="text-center text-xs text-slate-400 pt-2 cursor-pointer select-none" onclick="toggleAuthMode()">
          <span id="authToggleText">Already a member? <b class="text-indigo-400 hover:underline">Log in</b></span>
        </p>
      </div>
    </div>

    <!-- Main Content App -->
    <div id="appSection" class="hidden space-y-6">

      <!-- Create Broadcast Card -->
      <div class="theme-card p-5 sm:p-6 rounded-3xl shadow-xl">
        <div class="flex items-center gap-2 mb-4">
          <div class="w-2 h-2 rounded-full bg-indigo-400 animate-ping"></div>
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-300">Broadcast Quiet Activity</h3>
        </div>

        <div class="space-y-3">
          <!-- Categories Filter Grid -->
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
            <label class="cursor-pointer">
              <input type="radio" name="cat" value="Gym Buddy" class="peer hidden" checked>
              <div class="text-xs text-center py-2 px-3 rounded-xl border border-white/5 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-300 text-slate-400 font-medium transition">💪 Gym Sync</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cat" value="Study/Coding" class="peer hidden">
              <div class="text-xs text-center py-2 px-3 rounded-xl border border-white/5 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-300 text-slate-400 font-medium transition">💻 Study / Code</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cat" value="Casual Talk" class="peer hidden">
              <div class="text-xs text-center py-2 px-3 rounded-xl border border-white/5 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-300 text-slate-400 font-medium transition">☕ Casual</div>
            </label>
            <label class="cursor-pointer">
              <input type="radio" name="cat" value="Gaming" class="peer hidden">
              <div class="text-xs text-center py-2 px-3 rounded-xl border border-white/5 peer-checked:border-indigo-400 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-300 text-slate-400 font-medium transition">🎮 Gaming</div>
            </label>
          </div>

          <input id="postTitle" placeholder="Title (e.g. 6:30 AM Gym partner - Silent workout only)" class="w-full theme-input px-4 py-3 rounded-2xl text-xs outline-none">
          <textarea id="postDesc" rows="2" placeholder="Rules or notes (e.g. No small talk required, just form check & mutual focus)..." class="w-full theme-input px-4 py-3 rounded-2xl text-xs outline-none resize-none"></textarea>

          <div class="flex justify-end pt-1">
            <button onclick="submitPost()" class="theme-btn px-6 py-2.5 rounded-xl text-xs font-semibold shadow-md active:scale-95 transition">Post Signal</button>
          </div>
        </div>
      </div>

      <!-- Two Columns: Feed + Live Chat -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Feed List (Left 7 Cols) -->
        <div class="lg:col-span-7 space-y-4">
          <div class="flex items-center justify-between px-1">
            <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Live Activity Signals</span>
            <button onclick="fetchPosts()" class="text-xs text-indigo-400 hover:text-indigo-300 flex items-center gap-1 font-medium">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              Refresh
            </button>
          </div>
          <div id="postsFeed" class="space-y-3"></div>
        </div>

        <!-- Chat Lounge (Right 5 Cols) -->
        <div class="lg:col-span-5">
          <div class="theme-card p-4 rounded-3xl flex flex-col h-[520px] sticky top-20 shadow-xl">
            
            <div class="flex items-center justify-between pb-3 border-b border-white/5">
              <div class="flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <h4 class="text-xs font-bold tracking-tight">Quiet Lounge</h4>
              </div>
              <span class="text-[10px] text-slate-500 font-medium">Synced</span>
            </div>

            <!-- Messages Box -->
            <div id="chatMessages" class="flex-1 overflow-y-auto custom-scroll py-3 space-y-2.5 text-xs"></div>

            <!-- Icebreaker Prompt -->
            <div class="py-2">
              <button onclick="insertIcebreaker()" class="w-full text-left text-[11px] p-2.5 rounded-2xl theme-input flex items-center justify-between group hover:border-indigo-400 transition">
                <span id="promptText" class="truncate text-slate-300">🎲 Pick silent icebreaker...</span>
                <span class="text-[10px] text-indigo-400 shrink-0 font-medium ml-1">Tap</span>
              </button>
            </div>

            <!-- Input Bar -->
            <div class="flex gap-1.5 pt-2 border-t border-white/5">
              <input id="chatInput" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Say something quietly..." class="flex-1 theme-input px-3.5 py-2.5 rounded-2xl text-xs outline-none">
              <button onclick="sendChatMessage()" class="theme-btn px-4 py-2.5 rounded-2xl text-xs font-semibold active:scale-95 transition">Send</button>
            </div>

          </div>
        </div>

      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
