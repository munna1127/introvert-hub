<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lounge — Quiet Connections</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .glass { background: rgba(18, 24, 38, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: rgba(11, 15, 25, 0.6); border: 1px solid rgba(255, 255, 255, 0.1); }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 4px; }
  </style>
</head>
<body class="bg-[#0b0f19] text-slate-200 min-h-screen antialiased selection:bg-indigo-500 selection:text-white pb-12">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass border-b border-white/5 px-6 py-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-600 to-violet-400 flex items-center justify-center font-bold text-white shadow-lg shadow-indigo-500/20">L</div>
        <div>
          <h1 class="font-bold text-base tracking-tight text-white">Lounge</h1>
          <p class="text-[11px] text-slate-400">Zero pressure social space</p>
        </div>
      </div>
      <div id="navUser" class="hidden items-center gap-3">
        <span id="userBadge" class="text-xs px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 font-medium"></span>
        <button onclick="logout()" class="text-xs text-slate-400 hover:text-rose-400 transition-colors">Exit</button>
      </div>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-4 mt-8">

    <!-- Auth Card -->
    <div id="authSection" class="max-w-md mx-auto glass p-8 rounded-2xl shadow-2xl shadow-black/40">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold text-white tracking-tight">Step Inside</h2>
        <p class="text-xs text-slate-400 mt-1">No phone numbers. No real names required.</p>
      </div>

      <div class="space-y-3">
        <div id="signupFields">
          <input id="authUsername" type="text" placeholder="Anonymous handle (@silentcoder)" class="w-full glass-input px-4 py-3 rounded-xl text-sm outline-none focus:border-indigo-500/50 transition">
        </div>
        <input id="authEmail" type="email" placeholder="Email" class="w-full glass-input px-4 py-3 rounded-xl text-sm outline-none focus:border-indigo-500/50 transition">
        <input id="authPass" type="password" placeholder="Password" class="w-full glass-input px-4 py-3 rounded-xl text-sm outline-none focus:border-indigo-500/50 transition">
        
        <button id="authSubmitBtn" onclick="handleAuth()" class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3 rounded-xl text-sm shadow-lg shadow-indigo-600/25 transition">Enter Lounge</button>

        <p class="text-center text-xs text-slate-400 pt-3 cursor-pointer select-none" onclick="toggleAuthMode()">
          <span id="authToggleText">Already have a quiet space? <b class="text-indigo-400">Log In</b></span>
        </p>
      </div>
    </div>

    <!-- Main Workspace -->
    <div id="appSection" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-6">

      <!-- Left Column: Activity Hub & Creation -->
      <div class="lg:col-span-2 space-y-6">
        <!-- New Activity Box -->
        <div class="glass p-5 rounded-2xl">
          <h3 class="text-sm font-semibold text-white mb-3">Broadcast Silent Activity</h3>
          <div class="space-y-3">
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
              <label class="cursor-pointer">
                <input type="radio" name="cat" value="Gym Buddy" class="peer hidden" checked>
                <div class="text-xs text-center py-2 px-3 rounded-xl border border-white/5 peer-checked:border-indigo-500/50 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-300 text-slate-400 transition">Gym Buddy</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="cat" value="Study/Coding" class="peer hidden">
                <div class="text-xs text-center py-2 px-3 rounded-xl border border-white/5 peer-checked:border-indigo-500/50 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-300 text-slate-400 transition">Study / Code</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="cat" value="Casual Talk" class="peer hidden">
                <div class="text-xs text-center py-2 px-3 rounded-xl border border-white/5 peer-checked:border-indigo-500/50 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-300 text-slate-400 transition">Casual Talk</div>
              </label>
              <label class="cursor-pointer">
                <input type="radio" name="cat" value="Gaming" class="peer hidden">
                <div class="text-xs text-center py-2 px-3 rounded-xl border border-white/5 peer-checked:border-indigo-500/50 peer-checked:bg-indigo-500/10 peer-checked:text-indigo-300 text-slate-400 transition">Gaming</div>
              </label>
            </div>

            <input id="postTitle" placeholder="Title (e.g., 6 AM silent leg day companion)" class="w-full glass-input px-4 py-2.5 rounded-xl text-sm outline-none focus:border-indigo-500/50">
            <textarea id="postDesc" rows="2" placeholder="Details or quiet boundary notes..." class="w-full glass-input px-4 py-2.5 rounded-xl text-sm outline-none focus:border-indigo-500/50 resize-none"></textarea>

            <div class="flex justify-end">
              <button onclick="submitPost()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-5 py-2.5 rounded-xl transition shadow-md shadow-indigo-600/20">Post</button>
            </div>
          </div>
        </div>

        <!-- Feed List -->
        <div class="space-y-3">
          <div class="flex items-center justify-between px-1">
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">Activity Stream</h3>
            <button onclick="fetchPosts()" class="text-xs text-indigo-400 hover:text-indigo-300">Refresh</button>
          </div>
          <div id="postsFeed" class="space-y-3"></div>
        </div>
      </div>

      <!-- Right Column: Real-time Lounge Chat -->
      <div class="space-y-6">
        <div class="glass p-5 rounded-2xl flex flex-col h-[520px]">
          <div class="flex items-center justify-between pb-3 border-b border-white/5">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
              <h3 class="text-sm font-semibold text-white">Quiet Room</h3>
            </div>
            <span class="text-[10px] text-slate-500 uppercase font-mono">Live</span>
          </div>

          <div id="chatMessages" class="flex-1 overflow-y-auto custom-scroll py-3 space-y-3 text-xs"></div>

          <div class="pt-3 border-t border-white/5 flex gap-2">
            <input id="chatInput" onkeydown="if(event.key==='Enter') sendChatMessage()" placeholder="Type softly..." class="flex-1 glass-input px-3 py-2 rounded-xl text-xs outline-none focus:border-indigo-500/50">
            <button onclick="sendChatMessage()" class="bg-slate-800 hover:bg-indigo-600 text-slate-200 hover:text-white px-3 py-2 rounded-xl transition text-xs font-medium border border-white/5">Send</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
