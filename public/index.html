<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Lounge — Quiet Sync</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #07090e; color: #f8fafc; }
    .glass-card { background: rgba(18, 24, 38, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .glass-input { background: rgba(11, 15, 25, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); color: #fff; }
    .custom-scroll::-webkit-scrollbar { width: 3px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
  </style>
</head>
<body class="min-h-screen antialiased selection:bg-indigo-500 pb-20">

  <!-- Header -->
  <header class="sticky top-0 z-50 glass-card border-b border-white/5 px-4 py-3">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center font-bold text-sm text-white shadow-lg">L</div>
        <div>
          <span class="font-bold text-sm tracking-tight block">Lounge</span>
          <span class="text-[10px] text-slate-400">Silent Sync Radar</span>
        </div>
      </div>
      <div id="navUser" class="hidden items-center gap-2">
        <button onclick="openProfileModal()" id="userBadge" class="text-xs px-3 py-1 rounded-full bg-white/5 border border-white/10 text-indigo-300 font-bold hover:bg-white/10 transition">@handle</button>
        <button onclick="logout()" class="text-xs text-rose-400 hover:bg-rose-500/10 px-2 py-1 rounded-lg">Exit</button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 mt-4">

    <!-- Auth Form -->
    <div id="authSection" class="glass-card p-6 rounded-3xl shadow-2xl mt-8">
      <div class="text-center mb-6">
        <h2 class="text-xl font-bold tracking-tight">Enter Your Space</h2>
        <p class="text-xs text-slate-400 mt-1">Anonymous, low-energy connections</p>
      </div>

      <div class="space-y-3">
        <div id="signupFields" class="space-y-3">
          <div>
            <input id="authUsername" oninput="checkUsernameLive(this.value)" type="text" placeholder="Anonymous handle (@zen_sync)" class="w-full glass-input px-4 py-3 rounded-2xl text-xs outline-none">
            <span id="usernameCheckMsg" class="text-[10px] mt-1 block px-2 hidden"></span>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <select id="authInterest" class="glass-input px-3 py-2.5 rounded-xl text-xs outline-none">
              <option value="Gym">💪 Gym Partner</option>
              <option value="Coding">💻 Study / Code</option>
              <option value="Gaming">🎮 Gaming</option>
              <option value="Coffee">☕ Chill / Coffee</option>
            </select>
            <input id="authLocation" type="text" placeholder="City (e.g. Bhopal)" class="glass-input px-3 py-2.5 rounded-xl text-xs outline-none">
          </div>
        </div>
        <input id="authEmail" type="email" placeholder="Email address" class="w-full glass-input px-4 py-3 rounded-2xl text-xs outline-none">
        <input id="authPass" type="password" placeholder="Password" class="w-full glass-input px-4 py-3 rounded-2xl text-xs outline-none">
        
        <div id="forgotPassLink" class="text-right hidden">
          <button onclick="openForgotModal()" class="text-[11px] text-indigo-400 hover:underline">Forgot Password?</button>
        </div>

        <button id="authSubmitBtn" onclick="handleAuth()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-2xl text-xs shadow-lg transition">Enter Lounge</button>

        <p class="text-center text-xs text-slate-400 pt-2 cursor-pointer select-none" onclick="toggleAuthMode()">
          <span id="authToggleText">Already a member? <b class="text-indigo-400">Log In</b></span>
        </p>
      </div>
    </div>

    <!-- App View -->
    <div id="appSection" class="hidden space-y-4">
      <div class="flex items-center justify-around glass-card p-1 rounded-2xl">
        <button onclick="switchTab('match')" id="tabMatch" class="flex-1 py-2 text-xs font-bold rounded-xl bg-indigo-600 text-white transition">🔥 Match Deck</button>
        <button onclick="switchTab('inbox')" id="tabInbox" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-400 transition">💬 Chats & DMs</button>
        <button onclick="switchTab('signals')" id="tabSignals" class="flex-1 py-2 text-xs font-bold rounded-xl text-slate-400 transition">📡 Signals</button>
      </div>

      <!-- TAB 1: CARD DECK -->
      <div id="viewMatch" class="space-y-4">
        <div id="cardStackContainer" class="relative h-[430px] flex items-center justify-center"></div>
        <div class="flex items-center justify-center gap-6 pt-2">
          <button onclick="swipeAction('pass')" class="w-14 h-14 rounded-full glass-card border border-rose-500/30 text-rose-400 flex items-center justify-center text-xl shadow-lg hover:scale-110 active:scale-95 transition">✕</button>
          <button onclick="swipeAction('match')" class="w-16 h-16 rounded-full bg-gradient-to-tr from-indigo-500 to-violet-500 text-white flex items-center justify-center text-2xl shadow-lg shadow-indigo-500/30 hover:scale-110 active:scale-95 transition">⚡</button>
        </div>
      </div>

      <!-- TAB 2: INBOX -->
      <div id="viewInbox" class="hidden space-y-4">
        <div class="glass-card p-3 rounded-2xl">
          <span class="text-[10px] uppercase font-bold text-slate-500 block mb-2">Conversations</span>
          <div id="dmConversationList" class="flex gap-2 overflow-x-auto custom-scroll pb-1"></div>
        </div>

        <div class="glass-card p-4 rounded-3xl flex flex-col h-[460px]">
          <div class="flex items-center justify-between pb-3 border-b border-white/5">
            <div>
              <h4 id="activeChatTitle" class="text-xs font-bold text-indigo-300">Select a Chat</h4>
              <p id="activeChatSub" class="text-[10px] text-slate-400">Silent Sync active</p>
            </div>
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          </div>

          <div id="chatMessages" class="flex-1 overflow-y-auto custom-scroll py-3 space-y-2 text-xs"></div>

          <div class="flex gap-1.5 pt-2 border-t border-white/5">
            <input id="chatInput" onkeydown="if(event.key==='Enter') sendDirectMessage()" placeholder="Type softly..." class="flex-1 glass-input px-3.5 py-2.5 rounded-2xl text-xs outline-none">
            <button onclick="sendDirectMessage()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-2xl text-xs font-bold">Send</button>
          </div>
        </div>
      </div>

      <!-- TAB 3: SIGNALS -->
      <div id="viewSignals" class="hidden space-y-4">
        <div class="glass-card p-4 rounded-2xl space-y-2">
          <input id="postTitle" placeholder="Signal Title (e.g. 7 AM Silent gym buddy)" class="w-full glass-input px-3 py-2 rounded-xl text-xs outline-none">
          <textarea id="postDesc" rows="2" placeholder="Silent rules & details..." class="w-full glass-input px-3 py-2 rounded-xl text-xs outline-none resize-none"></textarea>
          <div class="flex justify-end">
            <button onclick="submitPost()" class="bg-indigo-600 px-4 py-1.5 rounded-xl text-xs font-bold">Broadcast</button>
          </div>
        </div>
        <div id="postsFeed" class="space-y-3"></div>
      </div>
    </div>

    <!-- Match Popup Modal -->
    <div id="matchPopup" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
      <div class="glass-card p-6 rounded-3xl max-w-xs w-full text-center space-y-4 border border-indigo-500/30">
        <div class="w-16 h-16 bg-gradient-to-tr from-indigo-500 to-violet-500 rounded-full mx-auto flex items-center justify-center text-3xl shadow-xl shadow-indigo-500/40 animate-bounce">⚡</div>
        <div>
          <h3 class="text-lg font-bold text-white">Silent Match!</h3>
          <p id="matchPopupText" class="text-xs text-slate-400 mt-1"></p>
        </div>
        <button onclick="openMatchedChat()" class="w-full bg-indigo-600 py-3 rounded-2xl text-xs font-bold">Open Direct DM 👋</button>
      </div>
    </div>

    <!-- Profile Settings Modal -->
    <div id="profileModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
      <div class="glass-card p-6 rounded-3xl max-w-xs w-full space-y-3 border border-white/10">
        <div class="flex justify-between items-center pb-2 border-b border-white/5">
          <h3 class="text-sm font-bold">Edit Profile</h3>
          <button onclick="closeProfileModal()" class="text-slate-400 text-xs">✕</button>
        </div>

        <div class="space-y-2">
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Handle</label>
            <input id="editUsername" type="text" class="w-full glass-input px-3 py-2 rounded-xl text-xs outline-none">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Interest</label>
            <select id="editInterest" class="w-full glass-input px-3 py-2 rounded-xl text-xs outline-none">
              <option value="Gym">💪 Gym Partner</option>
              <option value="Coding">💻 Study / Code</option>
              <option value="Gaming">🎮 Gaming</option>
              <option value="Coffee">☕ Chill / Coffee</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Location</label>
            <input id="editLocation" type="text" class="w-full glass-input px-3 py-2 rounded-xl text-xs outline-none">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-1">Quiet Bio</label>
            <textarea id="editBio" rows="2" class="w-full glass-input px-3 py-2 rounded-xl text-xs outline-none resize-none"></textarea>
          </div>
        </div>

        <button onclick="saveProfileChanges()" class="w-full bg-indigo-600 py-2.5 rounded-xl text-xs font-bold mt-2">Save Changes</button>
      </div>
    </div>

    <!-- Password Reset Modal -->
    <div id="forgotModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
      <div class="glass-card p-6 rounded-3xl max-w-xs w-full space-y-3 border border-indigo-500/20">
        <div class="flex justify-between items-center pb-2 border-b border-white/5">
          <h3 class="text-sm font-bold">Account Recovery</h3>
          <button onclick="closeForgotModal()" class="text-slate-400 text-xs">✕</button>
        </div>

        <!-- Step 1: Request Code -->
        <div id="forgotStep1" class="space-y-2">
          <p class="text-[11px] text-slate-400">Enter your registered email to verify account.</p>
          <input id="forgotEmail" type="email" placeholder="Registered email" class="w-full glass-input px-3 py-2 rounded-xl text-xs outline-none">
          <button onclick="requestResetCode()" class="w-full bg-indigo-600 py-2 rounded-xl text-xs font-bold mt-2">Verify Account</button>
        </div>

        <!-- Step 2: Enter New Password -->
        <div id="forgotStep2" class="space-y-2 hidden">
          <p class="text-[11px] text-emerald-400">Account verified! Set your new password.</p>
          <input id="newPassword" type="password" placeholder="New strong password" class="w-full glass-input px-3 py-2 rounded-xl text-xs outline-none">
          <button onclick="submitNewPassword()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-2 rounded-xl text-xs font-bold mt-2">Update Password</button>
        </div>
      </div>
    </div>

  </main>

  <script src="app.js"></script>
</body>
</html>
